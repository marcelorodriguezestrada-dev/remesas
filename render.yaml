services:
  - type: web
    name: remesas
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: NEXT_PUBLIC_TAKENOS_ALIAS
        sync: false
      - key: NEXT_PUBLIC_WHATSAPP_NUMERO
        sync: false
      - key: NEXT_PUBLIC_GRUPO_WHATSAPP
        sync: false
      - key: MARGEN_PORCENTAJE_DEFAULT
        value: "0.025"
